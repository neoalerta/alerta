name: Lint

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # 3.12: o autopep8 fixado no pre-commit (v2.0.4) usa lib2to3, que não
      # existe no 3.13. Os testes rodam em 3.13, a versão da imagem.
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit
          pip install -r requirements-dev.txt
      - name: Pre-commit hooks
        run: |
          pre-commit run -a --show-diff-on-failure
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=50 --max-line-length=127 --statistics
      - name: Security scan with bandit
        run: |
          bandit -r alerta -c pyproject.toml -q
