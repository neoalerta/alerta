#!dependabot

version: 2
updates:
  # Dependências Python: uma rodada por mês, tudo agrupado. No máximo um PR
  # de atualizações (menores e patches), um de majors e um de correções de
  # segurança, em vez de um PR por dependência.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      atualizacoes:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      majors:
        applies-to: version-updates
        update-types: ["major"]
      seguranca:
        applies-to: security-updates
        patterns: ["*"]

  # Actions usadas nos workflows: um PR por mês com todas.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
